<title>かんたんHP作成ツール</title>
<style>
/* ビルダー（編集画面）のUI。生成されるサイトの見た目とは無関係。 */
*,*::before,*::after{box-sizing:border-box}
:root{
  --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --line:#2a2f3a;
  --tx:#e7ebf0; --tx2:#98a2b3; --pri:#4c8dff; --danger:#f2565c;
  --r:8px;
}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--tx);
  font-family:"Helvetica Neue",Arial,"Hiragino Kaku Gothic ProN","Hiragino Sans",Meiryo,sans-serif;
  font-size:13px;line-height:1.7;overflow:hidden;
}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit}

/* ================= 全体レイアウト ================= */
.app{
  height:100vh;display:grid;
  grid-template-columns:236px 1fr 348px;
  grid-template-rows:52px 1fr;
  grid-template-areas:"top top top" "left stage right";
}
.topbar{
  grid-area:top;display:flex;align-items:center;gap:10px;padding:0 14px;
  background:var(--panel);border-bottom:1px solid var(--line)
}
.brand{font-weight:800;letter-spacing:.02em;margin-right:6px;white-space:nowrap}
.saved{color:var(--tx2);font-size:11.5px;margin-right:auto;min-width:80px}

.tb-btn{
  background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);
  padding:7px 13px;font-size:12.5px;font-weight:600;white-space:nowrap;
  transition:background .15s,border-color .15s
}
.tb-btn:hover{background:#262b36;border-color:#3a4150}
.tb-btn.primary{background:var(--pri);border-color:var(--pri);color:#fff}
.tb-btn.primary:hover{background:#3d7cf0}
.tb-btn.danger:hover{border-color:var(--danger);color:var(--danger)}

.devices{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.devices button{background:transparent;border:0;padding:7px 12px;font-size:12px;color:var(--tx2)}
.devices button.on{background:#2d3441;color:var(--tx);font-weight:700}

/* ================= パネル共通 ================= */
.panel{background:var(--panel);display:flex;flex-direction:column;min-height:0}
.panel.left{grid-area:left;border-right:1px solid var(--line)}
.panel.right{grid-area:right;border-left:1px solid var(--line)}
.panel-h{
  padding:12px 14px;font-size:11px;font-weight:800;letter-spacing:.14em;
  color:var(--tx2);border-bottom:1px solid var(--line)
}
.panel-body{padding:14px;overflow-y:auto;flex:1;min-height:0}

.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{
  flex:1;background:transparent;border:0;border-bottom:2px solid transparent;
  padding:13px 4px;font-size:12px;color:var(--tx2);font-weight:600
}
.tabs button.on{color:var(--tx);border-bottom-color:var(--pri)}

/* ================= 左：ブロック一覧 ================= */
.blocklist{overflow-y:auto;flex:1;padding:8px;min-height:0}
.bl-item{
  display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:var(--r);
  border:1px solid transparent;margin-bottom:3px;user-select:none
}
.bl-item:hover{background:var(--panel2)}
.bl-item.on{background:#20293a;border-color:var(--pri)}
.bl-ic{
  width:24px;height:24px;flex:none;display:grid;place-items:center;
  background:var(--panel2);border-radius:6px;font-size:12px;color:var(--tx2)
}
.bl-item.on .bl-ic{background:var(--pri);color:#fff}
.bl-name{flex:1;font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bl-sub{font-size:10.5px;color:var(--tx2);font-weight:400}
.bl-ops{display:flex;gap:1px;opacity:0;transition:opacity .12s}
.bl-item:hover .bl-ops,.bl-item.on .bl-ops{opacity:1}
.bl-ops button{
  background:transparent;border:0;padding:2px 5px;font-size:12px;color:var(--tx2);border-radius:4px;line-height:1
}
.bl-ops button:hover{background:#39404f;color:var(--tx)}
.bl-fixed{font-size:10px;color:var(--tx2);padding:0 4px}

/* ドラッグ&ドロップ */
.bl-item{cursor:grab}
.bl-item:active{cursor:grabbing}
.bl-item.dragging{opacity:.4}
.bl-item.over-top{box-shadow:0 -2px 0 0 var(--pri)}
.bl-item.over-bottom{box-shadow:0 2px 0 0 var(--pri)}
.blocklist.dropping{background:#151a24}
.bl-grip{color:#4a5464;font-size:12px;line-height:1;cursor:grab;flex:none}
.bl-item:hover .bl-grip{color:var(--tx2)}
.add-menu button{cursor:grab}
.add-menu button:active{cursor:grabbing}

/* 要素アニメのパネル */
.el-panel{
  border:1px solid var(--pri);border-radius:var(--r);background:#18202e;
  padding:12px;margin:-2px 0 16px
}
.el-panel .eh{display:flex;align-items:center;gap:8px;margin-bottom:11px}
.el-panel .badge{
  background:var(--pri);color:#fff;font-size:10.5px;font-weight:800;
  border-radius:4px;padding:2px 7px;flex:none
}
.el-panel .en{flex:1;font-size:12.5px;font-weight:700;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.el-panel .ex{background:transparent;border:0;color:var(--tx2);padding:2px 5px;border-radius:4px;font-size:12px}
.el-panel .ex:hover{background:#39404f;color:var(--tx)}
.el-panel .f{margin-bottom:10px}
.el-panel .f:last-child{margin-bottom:0}
.el-hint{
  font-size:11.5px;color:var(--tx2);background:#13161d;border:1px dashed var(--line);
  border-radius:var(--r);padding:11px 12px;margin:-2px 0 16px;line-height:1.75
}

.add-wrap{position:relative;padding:10px;border-top:1px solid var(--line)}
.add-btn{
  width:100%;background:var(--panel2);border:1px dashed var(--line);border-radius:var(--r);
  padding:10px;font-size:12.5px;font-weight:700;color:var(--tx2)
}
.add-btn:hover{color:var(--tx);border-color:var(--pri)}
.add-menu{
  position:absolute;bottom:56px;left:10px;right:10px;background:var(--panel2);
  border:1px solid var(--line);border-radius:var(--r);padding:6px;z-index:30;
  box-shadow:0 16px 40px rgba(0,0,0,.5);max-height:340px;overflow-y:auto
}
.add-menu button{
  display:flex;align-items:center;gap:9px;width:100%;background:transparent;border:0;
  padding:9px 10px;border-radius:6px;font-size:12.5px;text-align:left
}
.add-menu button:hover{background:#2f3644}

/* ================= 中央：プレビュー ================= */
.stage{
  grid-area:stage;background:#0a0c10;padding:18px;overflow:auto;
  display:flex;justify-content:center;align-items:flex-start
}
.frame{
  width:100%;height:100%;background:#fff;border-radius:10px;overflow:hidden;
  box-shadow:0 20px 60px rgba(0,0,0,.5);transition:width .2s ease
}
.frame iframe{width:100%;height:100%;border:0;display:block}

/* ================= 右：編集フォーム ================= */
.f{margin-bottom:15px}
.f > label{display:block;font-size:11.5px;font-weight:700;color:var(--tx2);margin-bottom:5px}
.f input[type=text],.f input[type=number],.f textarea,.f select{
  width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:6px;
  padding:8px 10px;color:var(--tx);font-size:12.5px
}
.f textarea{resize:vertical;min-height:70px;line-height:1.7}
.f input:focus,.f textarea:focus,.f select:focus{outline:none;border-color:var(--pri)}
.f .hint{font-size:10.5px;color:var(--tx2);margin-top:4px}

.f-row{display:flex;align-items:center;gap:9px}
.f-row input[type=color]{
  width:34px;height:30px;padding:0;background:none;border:1px solid var(--line);border-radius:6px;cursor:pointer
}
.f-row input[type=range]{flex:1;accent-color:var(--pri)}
.f-val{font-size:11.5px;color:var(--tx2);min-width:42px;text-align:right}

.sw{display:flex;align-items:center;gap:9px;cursor:pointer;font-size:12.5px;font-weight:600}
.sw input{width:16px;height:16px;accent-color:var(--pri);cursor:pointer}

.img-f{display:flex;gap:7px;align-items:center}
.img-f input{flex:1;min-width:0}
.img-f .pick{
  flex:none;background:var(--panel2);border:1px solid var(--line);border-radius:6px;
  padding:8px 10px;font-size:11.5px;white-space:nowrap
}
.img-f .pick:hover{border-color:var(--pri)}
.img-thumb{
  width:100%;height:74px;object-fit:cover;border-radius:6px;margin-top:7px;
  border:1px solid var(--line);background:#0a0c10;display:block
}

/* 繰り返し項目 */
.list{border:1px solid var(--line);border-radius:var(--r);padding:8px;background:#13161d}
.li{border:1px solid var(--line);border-radius:6px;margin-bottom:7px;background:var(--panel)}
.li-h{display:flex;align-items:center;gap:6px;padding:7px 9px;cursor:pointer}
.li-h .t{flex:1;font-size:12px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li-h .n{font-size:10.5px;color:var(--tx2);font-weight:700;min-width:15px}
.li-h button{background:transparent;border:0;color:var(--tx2);padding:2px 5px;border-radius:4px;font-size:12px;line-height:1}
.li-h button:hover{background:#39404f;color:var(--tx)}
.li-b{padding:2px 10px 10px;border-top:1px solid var(--line)}
.li-b .f{margin:11px 0 0}
.li-add{
  width:100%;background:transparent;border:1px dashed var(--line);border-radius:6px;
  padding:8px;font-size:12px;color:var(--tx2);font-weight:600
}
.li-add:hover{color:var(--tx);border-color:var(--pri)}

.empty{color:var(--tx2);text-align:center;padding:44px 16px;font-size:12.5px;line-height:1.9}
.sec-label{
  font-size:10.5px;font-weight:800;letter-spacing:.14em;color:var(--tx2);
  margin:22px 0 11px;padding-top:14px;border-top:1px solid var(--line)
}
.sec-label:first-child{margin-top:0;padding-top:0;border-top:0}
.edit-head{
  display:flex;align-items:center;gap:8px;margin:-2px 0 15px;padding-bottom:12px;
  border-bottom:1px solid var(--line);font-weight:800;font-size:13.5px
}

/* ================= モーダル ================= */
.modal{
  position:fixed;inset:0;background:rgba(5,7,10,.72);display:grid;place-items:center;
  z-index:100;padding:24px;backdrop-filter:blur(3px)
}
/* display 指定が hidden 属性に勝ってしまうので明示的に消す */
.modal[hidden],.add-menu[hidden],.panel-body[hidden]{display:none}
.modal-box{
  background:var(--panel);border:1px solid var(--line);border-radius:14px;
  padding:26px;width:100%;max-width:840px;max-height:88vh;overflow-y:auto
}
.modal-box.wide{max-width:960px;display:flex;flex-direction:column}
.modal-box h2{margin:0 0 6px;font-size:18px}
.modal-sub{margin:0 0 20px;color:var(--tx2);font-size:12.5px}
.modal-foot{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}
#codeArea{
  width:100%;height:52vh;background:#0b0d12;border:1px solid var(--line);border-radius:8px;
  color:#c9d4e2;padding:14px;font-family:Menlo,Consolas,monospace;font-size:11.5px;line-height:1.65;resize:none
}

.tpl-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.tpl-card{
  background:var(--panel2);border:1px solid var(--line);border-radius:11px;overflow:hidden;
  text-align:left;padding:0;transition:border-color .15s,transform .15s
}
.tpl-card:hover{border-color:var(--pri);transform:translateY(-3px)}
.tpl-prev{height:132px;display:flex;flex-direction:column;gap:5px;padding:13px}
.tpl-prev .bar{height:9px;border-radius:2px;opacity:.9}
.tpl-prev .big{height:24px;border-radius:3px;margin-top:5px}
.tpl-prev .row{display:flex;gap:5px;margin-top:auto}
.tpl-prev .row span{flex:1;height:30px;border-radius:3px}
.tpl-meta{padding:12px 14px 15px;border-top:1px solid var(--line)}
.tpl-meta b{display:block;font-size:13px;margin-bottom:3px}
.tpl-meta small{color:var(--tx2);font-size:11px;line-height:1.65;display:block}

@media(max-width:1180px){
  .app{grid-template-columns:200px 1fr 300px}
  .brand{display:none}
}

</style>
<style>
${themeCSS(state.theme)}
${SITE_CSS}
</style>
<div class="app">
  <!-- ================= 上部バー ================= -->
  <header class="topbar">
    <div class="brand">かんたんHP作成ツール</div>

    <button class="tb-btn" id="btnTemplates">テンプレートを選ぶ</button>
    <span class="saved" id="saved"></span>

    <div class="devices" id="devices">
      <button data-w="100%" class="on">PC</button>
      <button data-w="820px">タブレット</button>
      <button data-w="390px">スマホ</button>
    </div>

    <button class="tb-btn" id="btnCode">HTMLを見る</button>
    <button class="tb-btn danger" id="btnReset">最初から</button>
    <button class="tb-btn primary" id="btnExport">HTMLを書き出す</button>
  </header>

  <!-- ================= 左：ブロック一覧 ================= -->
  <aside class="panel left">
    <div class="panel-h">ページの構成</div>
    <div id="blockList" class="blocklist"></div>
    <div class="add-wrap">
      <button class="add-btn" id="btnAdd">＋ ブロックを追加</button>
      <div class="add-menu" id="addMenu" hidden></div>
    </div>
  </aside>

  <!-- ================= 中央：プレビュー ================= -->
  <main class="stage">
    <div class="frame" id="frame">
      <iframe id="preview" title="プレビュー"></iframe>
    </div>
  </main>

  <!-- ================= 右：編集 ================= -->
  <aside class="panel right">
    <div class="tabs">
      <button class="on" data-tab="edit">ブロック編集</button>
      <button data-tab="design">デザイン</button>
      <button data-tab="page">ページ設定</button>
    </div>
    <div class="panel-body" id="tab-edit"></div>
    <div class="panel-body" id="tab-design" hidden></div>
    <div class="panel-body" id="tab-page" hidden></div>
  </aside>
</div>

<!-- ================= テンプレート選択 ================= -->
<div class="modal" id="tplModal" hidden>
  <div class="modal-box">
    <h2>テンプレートを選ぶ</h2>
    <p class="modal-sub">選ぶと、いまの内容は置きかわります。あとから中身は自由に変えられます。</p>
    <div class="tpl-grid" id="tplGrid"></div>
    <div class="modal-foot"><button class="tb-btn" id="tplClose">閉じる</button></div>
  </div>
</div>

<!-- ================= HTML表示 ================= -->
<div class="modal" id="codeModal" hidden>
  <div class="modal-box wide">
    <h2>書き出されるHTML</h2>
    <p class="modal-sub">このまま1ファイルで動きます。サーバーにアップすれば公開できます。</p>
    <textarea id="codeArea" readonly spellcheck="false"></textarea>
    <div class="modal-foot">
      <button class="tb-btn" id="codeCopy">コピー</button>
      <button class="tb-btn" id="codeClose">閉じる</button>
    </div>
  </div>
</div>

<script>
/* ===== assets/site-css.js ===== */
/* 生成されるサイトに適用されるCSS。プレビューと書き出しHTMLの両方で使う。
   file:// でも動くように fetch せず JS 文字列として持つ。 */
const SITE_CSS = `
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  font-family:var(--font);
  font-size:16px;
  line-height:1.9;
  color:var(--c-text);
  background:var(--c-bg);
  -webkit-font-smoothing:antialiased;
  word-break:break-word;
}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
p{margin:0 0 1em}
p:last-child{margin-bottom:0}

.wrap{width:100%;max-width:var(--max);margin:0 auto;padding:0 24px}

/* 画像がまだ設定されていない場所の目印 */
.ph{width:100%;height:100%;display:grid;place-items:center}
.ph::before{content:"IMAGE";font-size:11px;font-weight:800;letter-spacing:.22em;opacity:.4}
.hero-media > .ph::before,.about-media > .ph::before{color:#fff;opacity:.8}

/* ---------- セクション共通 ---------- */
.sec{padding:clamp(56px,8vw,96px) 0;position:relative}
.sec.bg-surface{background:var(--c-surface)}
.sec.bg-primary{background:var(--c-primary);color:#fff}
.sec.bg-dark{background:var(--c-dark);color:#fff}
.sec.bg-primary .sec-sub,.sec.bg-dark .sec-sub{color:rgba(255,255,255,.75)}
.sec.bg-primary .card,.sec.bg-dark .card{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.18)}

.sec-head{max-width:760px;margin:0 auto clamp(32px,5vw,56px);text-align:center}
.sec-head.left{text-align:left;margin-left:0}
.eyebrow{
  display:inline-block;margin:0 0 12px;font-size:12px;font-weight:700;
  letter-spacing:.18em;text-transform:uppercase;color:var(--c-primary)
}
.bg-primary .eyebrow,.bg-dark .eyebrow{color:var(--c-accent)}
.sec-title{
  margin:0 0 14px;font-size:clamp(24px,3.6vw,36px);line-height:1.4;
  letter-spacing:.02em;font-weight:800
}
.sec-sub{margin:0;color:var(--c-muted);font-size:15px}

/* ---------- ボタン ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:14px 30px;border-radius:var(--radius);
  background:var(--c-primary);color:#fff;font-weight:700;font-size:15px;
  border:1.5px solid transparent;cursor:pointer;
  transition:transform .18s ease,box-shadow .18s ease,opacity .18s ease;
  box-shadow:0 6px 20px -8px var(--c-primary)
}
.btn:hover{transform:translateY(-2px);box-shadow:0 12px 26px -10px var(--c-primary)}
.btn.ghost{background:transparent;color:inherit;border-color:currentColor;box-shadow:none;opacity:.9}
.btn.ghost:hover{opacity:1;box-shadow:none}
.btn.accent{background:var(--c-accent);box-shadow:0 6px 20px -8px var(--c-accent)}
.btn.sm{padding:10px 20px;font-size:14px}
.btn-row{display:flex;flex-wrap:wrap;gap:14px;margin-top:32px}
.center .btn-row,.hero.center .btn-row{justify-content:center}

/* ---------- ヘッダー ---------- */
.hdr{
  position:relative;z-index:50;background:var(--c-bg);
  border-bottom:1px solid var(--c-border)
}
.hdr.sticky{position:sticky;top:0;background:color-mix(in srgb,var(--c-bg) 86%,transparent);backdrop-filter:blur(12px)}
.hdr-in{display:flex;align-items:center;gap:24px;height:72px}
.logo{font-weight:800;font-size:19px;letter-spacing:.02em;display:flex;align-items:center;gap:10px}
.logo img{height:32px;width:auto}
.nav{display:flex;align-items:center;gap:28px;margin-left:auto}
.nav a{font-size:14px;font-weight:600;color:var(--c-muted);transition:color .15s}
.nav a:hover{color:var(--c-primary)}
.hdr .btn{margin-left:4px}
.hdr-toggle{
  display:none;margin-left:auto;width:44px;height:44px;border:1px solid var(--c-border);
  background:transparent;border-radius:10px;font-size:18px;cursor:pointer;color:inherit
}

/* ---------- ヒーロー ---------- */
.hero{position:relative;overflow:hidden;padding:clamp(64px,9vw,120px) 0}
.hero.center{text-align:center}
.hero-in{position:relative;z-index:2}
.hero-title{margin:0 0 20px;font-size:clamp(30px,5.4vw,56px);line-height:1.28;letter-spacing:.01em;font-weight:800}
.hero-text{margin:0;font-size:clamp(15px,1.6vw,18px);color:var(--c-muted);max-width:620px}
.hero.center .hero-text{margin-inline:auto}
.hero-media{
  border-radius:var(--radius);overflow:hidden;aspect-ratio:4/3;
  background:linear-gradient(135deg,var(--c-primary),var(--c-accent));
  box-shadow:0 30px 60px -30px rgba(15,23,42,.45)
}
.hero-media img{width:100%;height:100%;object-fit:cover}
.hero.split .hero-in{display:grid;grid-template-columns:1.02fr .98fr;gap:clamp(32px,5vw,64px);align-items:center}
.hero.split .hero-title{font-size:clamp(28px,3.4vw,42px)}
.hero.cover{color:#fff}
.hero.cover .hero-text{color:rgba(255,255,255,.82)}
.hero-bg{position:absolute;inset:0;z-index:0;background:linear-gradient(135deg,var(--c-primary),var(--c-accent))}
.hero-bg img{width:100%;height:100%;object-fit:cover}
.hero-bg::after{content:"";position:absolute;inset:0;background:var(--hero-overlay,rgba(15,23,42,.55))}
.hero.center.cover .hero-in,.hero.left.cover .hero-in{padding:clamp(24px,4vw,48px) 0}

/* ---------- 特徴 / カード ---------- */
.grid{display:grid;gap:24px}
.grid.c2{grid-template-columns:repeat(2,1fr)}
.grid.c3{grid-template-columns:repeat(3,1fr)}
.grid.c4{grid-template-columns:repeat(4,1fr)}
.card{
  background:var(--c-bg);border:1px solid var(--c-border);border-radius:var(--radius);
  padding:32px 28px;transition:transform .2s ease,box-shadow .2s ease
}
.card:hover{transform:translateY(-4px);box-shadow:0 20px 40px -24px rgba(15,23,42,.35)}
.card .ic{font-size:30px;line-height:1;margin-bottom:16px;display:block}
.card h3{margin:0 0 10px;font-size:18px;font-weight:700;line-height:1.5}
.card p{margin:0;font-size:14.5px;color:var(--c-muted)}
.card .num{
  display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;
  border-radius:50%;background:var(--c-primary);color:#fff;font-weight:800;margin-bottom:16px
}

/* ---------- About ---------- */
.about-in{display:grid;grid-template-columns:1fr 1fr;gap:clamp(32px,5vw,64px);align-items:center}
.about-in.rev .about-media{order:2}
.about-media{border-radius:var(--radius);overflow:hidden;aspect-ratio:4/3;background:linear-gradient(135deg,var(--c-primary),var(--c-accent))}
.about-media img{width:100%;height:100%;object-fit:cover}
.about-body .sec-title{font-size:clamp(22px,3vw,30px)}
.about-body p{color:var(--c-muted)}

/* ---------- ギャラリー ---------- */
.gal{display:grid;gap:14px;grid-template-columns:repeat(3,1fr)}
.gal figure{
  margin:0;border-radius:var(--radius);overflow:hidden;aspect-ratio:1/1;
  background:var(--c-surface);border:1px solid var(--c-border)
}
.bg-surface .gal figure{background:var(--c-bg)}
.gal img{width:100%;height:100%;object-fit:cover;transition:transform .35s ease}
.gal figure:hover img{transform:scale(1.06)}

/* ---------- 料金 ---------- */
.plan{
  background:var(--c-bg);border:1px solid var(--c-border);border-radius:var(--radius);
  padding:36px 30px;display:flex;flex-direction:column
}
.plan.feat{border-color:var(--c-primary);box-shadow:0 24px 48px -28px var(--c-primary);position:relative}
.plan .tag{
  position:absolute;top:-13px;left:50%;transform:translateX(-50%);
  background:var(--c-primary);color:#fff;font-size:12px;font-weight:700;
  padding:5px 14px;border-radius:999px;white-space:nowrap
}
.plan h3{margin:0 0 6px;font-size:17px;font-weight:700}
.plan .price{font-size:34px;font-weight:800;letter-spacing:-.01em;line-height:1.3}
.plan .price span{font-size:14px;font-weight:600;color:var(--c-muted);margin-left:4px}
.plan ul{list-style:none;margin:22px 0;padding:0;display:grid;gap:10px}
.plan li{font-size:14.5px;color:var(--c-muted);padding-left:26px;position:relative}
.plan li::before{content:"✓";position:absolute;left:0;color:var(--c-primary);font-weight:800}
.plan .btn{margin-top:auto;width:100%}

/* ---------- FAQ ---------- */
.faq{max-width:800px;margin:0 auto;display:grid;gap:12px}
.faq details{border:1px solid var(--c-border);border-radius:var(--radius);background:var(--c-bg);overflow:hidden}
.faq summary{
  padding:20px 24px;font-weight:700;cursor:pointer;list-style:none;
  display:flex;align-items:center;gap:12px;font-size:15.5px
}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";margin-left:auto;color:var(--c-primary);font-size:20px;font-weight:800}
.faq details[open] summary::after{content:"−"}
.faq .a{padding:0 24px 22px;color:var(--c-muted);font-size:14.5px}

/* ---------- CTA帯 ---------- */
.cta-in{text-align:center;max-width:720px;margin:0 auto}
.cta-in .sec-title{margin-bottom:12px}
.cta-in p{opacity:.85}

/* ---------- お問い合わせ ---------- */
.contact-in{display:grid;grid-template-columns:1fr 1fr;gap:clamp(32px,5vw,56px)}
.contact-in.only1{grid-template-columns:1fr;max-width:640px;margin:0 auto}
.info{display:grid;gap:18px;align-content:start}
.info div{display:grid;gap:2px}
.info dt{font-size:12px;font-weight:700;letter-spacing:.12em;color:var(--c-primary)}
.info dd{margin:0;font-size:16px;font-weight:600}
.form{display:grid;gap:14px}
.form label{display:grid;gap:6px;font-size:13px;font-weight:700}
.form input,.form textarea{
  font:inherit;font-size:15px;padding:13px 15px;border:1px solid var(--c-border);
  border-radius:calc(var(--radius) * .7);background:var(--c-bg);color:inherit;width:100%
}
.form textarea{min-height:130px;resize:vertical}
.form input:focus,.form textarea:focus{outline:2px solid var(--c-primary);outline-offset:1px;border-color:transparent}

/* ---------- 自由テキスト ---------- */
.rich{max-width:760px;margin:0 auto;font-size:16px}
.rich.left{margin-left:0}

/* ---------- フッター ---------- */
.ftr{background:var(--c-dark);color:rgba(255,255,255,.72);padding:56px 0 32px;font-size:14px}
.ftr-in{display:flex;flex-wrap:wrap;gap:24px;align-items:center;justify-content:space-between}
.ftr .logo{color:#fff;font-size:17px}
.ftr-nav{display:flex;flex-wrap:wrap;gap:22px}
.ftr-nav a{transition:color .15s}
.ftr-nav a:hover{color:#fff}
.copy{margin-top:32px;padding-top:20px;border-top:1px solid rgba(255,255,255,.12);font-size:12.5px;opacity:.7}

/* ---------- テンプレート別の味付け ---------- */
.sec-title,.hero-title,.logo,.plan h3,.card h3{font-family:var(--font-head)}
.tpl-shop .card{text-align:center}
.tpl-studio .hero-title{letter-spacing:-.02em}
.tpl-studio .card{background:transparent}
.tpl-studio .nav a{color:rgba(255,255,255,.7)}
.tpl-studio .hdr{border-bottom-color:rgba(255,255,255,.12)}

/* ==========================================================
   文字アニメーション
   [data-ta] が付いた見出しを、JSが1文字ずつ span に分割する。
   画面に入ると .in が付いて再生される。
   ========================================================== */
[data-ta] .ln{display:block}
[data-ta] .ch{display:inline-block;white-space:pre;will-change:transform,opacity}
[data-ta]:not(.in) .ch{opacity:0}
[data-ta].ta-none .ch{opacity:1}

@keyframes ta-fadeup{from{opacity:0;transform:translateY(.65em)}to{opacity:1;transform:none}}
[data-ta].ta-fadeup.in .ch{animation:ta-fadeup var(--ta-dur) var(--ta-ease) calc(var(--ta-delay,0s) + var(--i)*var(--ta-stagger)) both}

[data-ta].ta-maskline .ln{overflow:hidden;padding-bottom:.08em}
@keyframes ta-maskline{from{transform:translateY(110%)}to{transform:none}}
[data-ta].ta-maskline.in .ch{animation:ta-maskline var(--ta-dur) var(--ta-ease) calc(var(--ta-delay,0s) + var(--i)*var(--ta-stagger)) both}

@keyframes ta-blur{from{opacity:0;filter:blur(18px);transform:scale(1.18)}to{opacity:1;filter:blur(0);transform:none}}
[data-ta].ta-blur.in .ch{animation:ta-blur var(--ta-dur) var(--ta-ease) calc(var(--ta-delay,0s) + var(--i)*var(--ta-stagger)) both}

[data-ta].ta-flip3d .ln{perspective:700px}
@keyframes ta-flip3d{from{opacity:0;transform:rotateX(-95deg)}to{opacity:1;transform:none}}
[data-ta].ta-flip3d.in .ch{transform-origin:50% 100%;
  animation:ta-flip3d var(--ta-dur) var(--ta-ease) calc(var(--ta-delay,0s) + var(--i)*var(--ta-stagger)) both}

@keyframes ta-drop{from{opacity:0;transform:translateY(-.9em) rotate(-26deg)}to{opacity:1;transform:none}}
[data-ta].ta-drop.in .ch{animation:ta-drop var(--ta-dur) var(--ta-ease) calc(var(--ta-delay,0s) + var(--i)*var(--ta-stagger)) both}

@keyframes ta-bounce{
  0%{opacity:0;transform:translateY(-1.3em) scale(.55)}
  55%{opacity:1;transform:translateY(.14em) scale(1.08)}
  75%{transform:translateY(-.06em) scale(.97)}
  100%{opacity:1;transform:none}}
[data-ta].ta-bounce.in .ch{animation:ta-bounce var(--ta-dur) var(--ta-ease) calc(var(--ta-delay,0s) + var(--i)*var(--ta-stagger)) both}

@keyframes ta-slidealt{from{opacity:0;transform:translateX(var(--dir,-.8em))}to{opacity:1;transform:none}}
[data-ta].ta-slidealt.in .ch{animation:ta-slidealt var(--ta-dur) var(--ta-ease) calc(var(--ta-delay,0s) + var(--i)*var(--ta-stagger)) both}

@keyframes ta-scatter{
  from{opacity:0;transform:translate(var(--x,0),var(--y,0)) rotate(var(--r,0deg)) scale(.35)}
  to{opacity:1;transform:none}}
[data-ta].ta-scatter.in .ch{animation:ta-scatter var(--ta-dur) var(--ta-ease) calc(var(--ta-delay,0s) + var(--i)*var(--ta-stagger)) both}

@keyframes ta-neon{
  0%{opacity:.15;text-shadow:none}
  12%{opacity:1;text-shadow:0 0 6px var(--c-primary),0 0 18px var(--c-primary)}
  16%{opacity:.25;text-shadow:none}
  22%{opacity:1;text-shadow:0 0 6px var(--c-primary),0 0 18px var(--c-primary)}
  28%{opacity:.4;text-shadow:none}
  36%,100%{opacity:1;text-shadow:0 0 8px var(--c-primary),0 0 26px var(--c-primary),0 0 48px var(--c-primary)}}
[data-ta].ta-neon.in .ch{animation:ta-neon var(--ta-dur) linear calc(var(--ta-delay,0s) + var(--i)*var(--ta-stagger)) both}

[data-ta].ta-fillgrad{
  background:linear-gradient(100deg,var(--c-primary),var(--c-accent)) 0 0/0% 100% no-repeat,
             linear-gradient(var(--c-muted),var(--c-muted));
  -webkit-background-clip:text;background-clip:text;
  color:transparent;-webkit-text-fill-color:transparent}
@keyframes ta-fillgrad{from{background-size:0% 100%,100% 100%}to{background-size:100% 100%,100% 100%}}
[data-ta].ta-fillgrad.in{animation:ta-fillgrad var(--ta-dur) var(--ta-ease) var(--ta-delay,0s) both}

/* スクランブル・タイプライターはJSで動かす */
[data-ta].ta-type .ch{visibility:hidden}
[data-ta].ta-type .ch.show{visibility:visible}
.ta-cursor{display:inline-block;width:.06em;height:1em;background:currentColor;
  vertical-align:-.12em;margin-left:.04em;animation:ta-blink .9s steps(1) infinite}
@keyframes ta-blink{0%,49%{opacity:1}50%,100%{opacity:0}}

/* ==========================================================
   画像・要素のアニメーション
   [data-ia] が付いた要素に、JSが ia-on と ia-<種類> を付ける。
   （JSが動かない環境では何も隠さない＝そのまま表示される）
   ========================================================== */
.ia-on:not(.in){opacity:0}

@keyframes ia-zoomin{from{opacity:0;transform:scale(1.16)}to{opacity:1;transform:none}}
.ia-zoomin.in{animation:ia-zoomin var(--ta-dur) var(--ta-ease) var(--ia-delay,0s) both}

@keyframes ia-zoomout{from{opacity:0;transform:scale(.84)}to{opacity:1;transform:none}}
.ia-zoomout.in{animation:ia-zoomout var(--ta-dur) var(--ta-ease) var(--ia-delay,0s) both}

@keyframes ia-slideleft{from{opacity:0;transform:translateX(-9%)}to{opacity:1;transform:none}}
.ia-slideleft.in{animation:ia-slideleft var(--ta-dur) var(--ta-ease) var(--ia-delay,0s) both}

@keyframes ia-slideright{from{opacity:0;transform:translateX(9%)}to{opacity:1;transform:none}}
.ia-slideright.in{animation:ia-slideright var(--ta-dur) var(--ta-ease) var(--ia-delay,0s) both}

@keyframes ia-slideup{from{opacity:0;transform:translateY(11%)}to{opacity:1;transform:none}}
.ia-slideup.in{animation:ia-slideup var(--ta-dur) var(--ta-ease) var(--ia-delay,0s) both}

@keyframes ia-wipe{from{clip-path:inset(100% 0 0 0)}to{clip-path:inset(0 0 0 0)}}
.ia-wipe{overflow:hidden}
.ia-wipe.in{opacity:1;animation:ia-wipe var(--ta-dur) cubic-bezier(.76,0,.24,1) var(--ia-delay,0s) both}

@keyframes ia-circle{from{clip-path:circle(0% at 50% 50%)}to{clip-path:circle(78% at 50% 50%)}}
.ia-circle.in{opacity:1;animation:ia-circle var(--ta-dur) cubic-bezier(.76,0,.24,1) var(--ia-delay,0s) both}

@keyframes ia-blurin{from{opacity:0;filter:blur(22px);transform:scale(1.06)}to{opacity:1;filter:blur(0);transform:none}}
.ia-blurin.in{animation:ia-blurin var(--ta-dur) var(--ta-ease) var(--ia-delay,0s) both}

@keyframes ia-tilt3d{from{opacity:0;transform:perspective(1100px) rotateY(-22deg) translateX(-4%)}
  to{opacity:1;transform:none}}
.ia-tilt3d.in{transform-origin:0% 50%;
  animation:ia-tilt3d var(--ta-dur) var(--ta-ease) var(--ia-delay,0s) both}

@keyframes ia-flipup{from{opacity:0;transform:perspective(1100px) rotateX(-52deg)}to{opacity:1;transform:none}}
.ia-flipup.in{transform-origin:50% 100%;
  animation:ia-flipup var(--ta-dur) var(--ta-ease) var(--ia-delay,0s) both}

/* ループするもの */
@keyframes ia-kenburns{0%{transform:scale(1) translate(0,0)}100%{transform:scale(1.12) translate(-1.5%,-1.5%)}}
.ia-kenburns{overflow:hidden}
.ia-kenburns.in{opacity:1}
.ia-kenburns.in > img{animation:ia-kenburns 14s ease-in-out infinite alternate}

@keyframes ia-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.ia-float.in{opacity:1;animation:ia-float 4.5s ease-in-out infinite}

/* ---------- ブロックの出現 ---------- */
.rv{opacity:0;transform:translateY(34px);
  transition:opacity .85s cubic-bezier(.2,.7,.3,1),transform .85s cubic-bezier(.2,.7,.3,1)}
.rv.in{opacity:1;transform:none}

/* ---------- レスポンシブ ---------- */
@media(max-width:900px){
  .grid.c3,.grid.c4{grid-template-columns:repeat(2,1fr)}
  .hero.split .hero-in,.about-in,.contact-in{grid-template-columns:1fr}
  .about-in.rev .about-media{order:0}
  .gal{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:640px){
  .sec{padding:56px 0}
  .wrap{padding:0 20px}
  .grid.c2,.grid.c3,.grid.c4{grid-template-columns:1fr}
  .hdr-toggle{display:block}
  .nav{
    display:none;position:absolute;top:100%;left:0;right:0;flex-direction:column;
    align-items:stretch;gap:0;background:var(--c-bg);border-bottom:1px solid var(--c-border);
    padding:8px 20px 16px;margin:0
  }
  .nav.open{display:flex}
  .nav a{padding:13px 0;border-bottom:1px solid var(--c-border)}
  .hdr .btn{display:none}
  .hdr-in{height:64px}
  .btn-row .btn{width:100%}
  .ftr-in{flex-direction:column;align-items:flex-start}
}

/* ---------- 動きを減らす設定への配慮 ---------- */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;
    transition-duration:.001ms!important;scroll-behavior:auto!important}
  [data-ta] .ch{opacity:1!important;transform:none!important;filter:none!important;visibility:visible!important}
  [data-ta].ta-fillgrad{background-size:100% 100%,100% 100%!important}
  .ia-on{opacity:1!important;transform:none!important;filter:none!important;clip-path:none!important}
  .rv{opacity:1!important;transform:none!important}
}
`;

/* 書き出したHTMLでも動く最小限のJS
   ① ハンバーガーメニュー ② 文字アニメーション ③ ブロックの出現 */
const SITE_JS = `
(function(){
  /* ---------- ハンバーガーメニュー ---------- */
  var t=document.querySelector('.hdr-toggle'),n=document.querySelector('.hdr .nav');
  if(t&&n){t.onclick=function(){n.classList.toggle('open')};}
  document.querySelectorAll('.nav a').forEach(function(a){
    a.addEventListener('click',function(){ if(n) n.classList.remove('open'); });
  });

  var d=document, body=d.body;
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- 見出しを1文字ずつに分割 ---------- */
  function lineTexts(el){
    var lines=[[]];
    [].slice.call(el.childNodes).forEach(function(nd){
      if(nd.nodeName==='BR') lines.push([]);
      else lines[lines.length-1].push(nd.textContent);
    });
    return lines.map(function(p){return p.join('')});
  }

  function split(el, anim){
    var lines = lineTexts(el), i = 0;
    el.textContent = '';
    lines.forEach(function(text){
      var ln = d.createElement('span'); ln.className = 'ln';
      if(anim === 'maskline'){
        var one = d.createElement('span'); one.className = 'ch';
        one.style.setProperty('--i', i++);
        one.textContent = text || ' ';
        ln.appendChild(one);
      } else {
        Array.from(text).forEach(function(c){
          var ch = d.createElement('span'); ch.className = 'ch';
          ch.style.setProperty('--i', i++);
          if(c === ' '){ ch.className += ' sp'; ch.innerHTML = '&nbsp;'; }
          else { ch.textContent = c; ch.setAttribute('data-c', c); }
          if(anim === 'slidealt') ch.style.setProperty('--dir', (i%2 ? '-.9em' : '.9em'));
          if(anim === 'scatter'){
            ch.style.setProperty('--x', ((Math.random()*2-1)*2.4).toFixed(2)+'em');
            ch.style.setProperty('--y', ((Math.random()*2-1)*1.8).toFixed(2)+'em');
            ch.style.setProperty('--r', ((Math.random()*2-1)*90).toFixed(0)+'deg');
          }
          ln.appendChild(ch);
        });
      }
      el.appendChild(ln);
    });
  }

  var RND='ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789#$%&@';
  function runScramble(el){
    var chs=[].slice.call(el.querySelectorAll('.ch'));
    var dur=parseFloat(getComputedStyle(el).getPropertyValue('--ta-dur'))*1000||900;
    var stg=parseFloat(getComputedStyle(el).getPropertyValue('--ta-stagger'))*1000||40;
    chs.forEach(function(c){ c.dataset.final=c.textContent; c.textContent=''; c.style.opacity=1; });
    var step=Math.max(1,Math.round(stg/16)), span=Math.round(dur/16), f=0;
    (function tick(){
      chs.forEach(function(c,i){
        var s=i*step;
        if(f>=s+span) c.textContent=c.dataset.final;
        else if(f>=s) c.textContent=RND[Math.floor(Math.random()*RND.length)];
      });
      if(f++ < chs.length*step+span) requestAnimationFrame(tick);
      else chs.forEach(function(c){ c.textContent=c.dataset.final; });
    })();
  }
  function runType(el){
    var chs=[].slice.call(el.querySelectorAll('.ch'));
    var stg=parseFloat(getComputedStyle(el).getPropertyValue('--ta-stagger'))*1000||40;
    var cur=d.createElement('span'); cur.className='ta-cursor';
    if(el.lastElementChild) el.lastElementChild.appendChild(cur);
    chs.forEach(function(c,i){ c.style.opacity=1;
      setTimeout(function(){ c.classList.add('show'); }, i*Math.max(20,stg)); });
  }

  /* ---------- 準備 ---------- */
  var def = body.getAttribute('data-anim') || 'none';
  var targets = [].slice.call(d.querySelectorAll('[data-ta]'));
  targets.forEach(function(el){
    var a = el.getAttribute('data-anim') || def;
    el.classList.add('ta-' + a);
    if(a === 'none' || reduce){ el.classList.add('in'); return; }
    if(a !== 'fillgrad') split(el, a);
  });

  /* 画像・要素のアニメーション */
  [].slice.call(d.querySelectorAll('[data-ia]')).forEach(function(el){
    var a = el.getAttribute('data-anim');
    if(!a || a === 'none' || reduce) return;
    el.classList.add('ia-on', 'ia-' + a);
  });

  /* 個別の「開始までの待ち」（style属性がぶつからないよう data 属性から反映する） */
  [].slice.call(d.querySelectorAll('[data-delay]')).forEach(function(el){
    var v = el.getAttribute('data-delay') + 'ms';
    el.style.setProperty(el.hasAttribute('data-ia') ? '--ia-delay' : '--ta-delay', v);
  });

  if(body.getAttribute('data-reveal') === '1' && !reduce){
    [].slice.call(d.querySelectorAll('.sec, .hero')).forEach(function(s){ s.classList.add('rv'); });
  }

  /* ---------- 画面に入ったら再生 ---------- */
  var watch = [].slice.call(d.querySelectorAll('[data-ta]:not(.in), .ia-on, .rv'));
  if(!('IntersectionObserver' in window) || reduce){
    watch.forEach(function(el){ el.classList.add('in'); });
  }else{
    var io = new IntersectionObserver(function(es){
      es.forEach(function(e){
        if(!e.isIntersecting) return;
        var el = e.target;
        el.classList.add('in');
        if(el.classList.contains('ta-scramble')) runScramble(el);
        if(el.classList.contains('ta-type'))     runType(el);
        io.unobserve(el);
      });
    }, {threshold:.15, rootMargin:'0px 0px -6% 0px'});
    watch.forEach(function(el){ io.observe(el); });
  }
})();
`;

</script>
<script>
/* ===== assets/blocks.js ===== */
/* ブロックの定義。
   1ブロック = { label, icon, fields(編集フォームの項目), defaults(初期値), render(HTML生成) }
   fields を書けば編集フォームは自動で作られる。ブロックを増やしたい時はここに足すだけ。 */

/* ---------- 小さなヘルパ ---------- */
const esc = (s) =>
  String(s ?? '').replace(/[&<>"']/g, (c) =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nl2br = (s) => esc(s).replace(/\n/g, '<br>');
const attr = (name, v) => (v ? ` ${name}="${esc(v)}"` : '');

/* 画像URLがあれば <img>、無ければ何も出さない（ロゴ・背景用） */
const img = (src, alt) => (src ? `<img src="${esc(src)}" alt="${esc(alt || '')}" loading="lazy">` : '');
/* 画像を置く枠。未設定なら「IMAGE」のプレースホルダを出す */
const media = (src, alt) => (src ? img(src, alt) : '<span class="ph" aria-hidden="true"></span>');

/* セクションの外枠 */
function sec(type, p, inner, extraClass = '') {
  const cls = ['sec', `sec-${type}`, p.bg ? `bg-${p.bg}` : '', extraClass].filter(Boolean).join(' ');
  return `<section class="${cls}"${attr('id', p.anchor)}>\n  <div class="wrap">\n${inner}\n  </div>\n</section>`;
}

/* 見出しブロック（アイキャッチ・タイトル・サブ） */
function head(p, align = 'center') {
  if (!p.eyebrow && !p.title && !p.text) return '';
  return `    <div class="sec-head${align === 'left' ? ' left' : ''}">
${p.eyebrow ? `      <span class="eyebrow"${el(p, 'eyebrow', 'ta', '小見出し')}>${esc(p.eyebrow)}</span>\n` : ''}${p.title ? `      <h2 class="sec-title"${el(p, 'title', 'ta', '見出し')}>${nl2br(p.title)}</h2>\n` : ''}${p.text ? `      <p class="sec-sub"${el(p, 'text', 'ta', '説明文')}>${nl2br(p.text)}</p>\n` : ''}    </div>`;
}

/* ボタン群 */
function buttons(list, extraClass = '') {
  if (!list || !list.length) return '';
  const items = list
    .filter((b) => b.label)
    .map((b) => `      <a class="btn${b.style && b.style !== 'primary' ? ' ' + b.style : ''}" href="${esc(b.href || '#')}">${esc(b.label)}</a>`)
    .join('\n');
  return items ? `    <div class="btn-row ${extraClass}">\n${items}\n    </div>` : '';
}

/* 要素にアニメーション用の目印を付ける。
   role  : props.anims のキー
   kind  : 'ta'（文字）/ 'ia'（画像・要素）
   label : 編集画面に表示する名前
   ※ 遅延は style ではなく data-delay で渡す（既存の style 属性とぶつからないように） */
function el(p, role, kind, label) {
  const cfg = (p.anims || {})[role] || {};
  let out = ` data-el="${esc(role)}" data-elname="${esc(label)}" data-elkind="${kind}" data-${kind}`;
  if (cfg.a) out += ` data-anim="${esc(cfg.a)}"`;
  if (cfg.d) out += ` data-delay="${parseInt(cfg.d, 10) || 0}"`;
  return out;
}

<script>
/* ===== assets/app.js ===== */
/* ================================================================
   かんたんHP作成ツール — 編集画面のロジック
   state（サイトのデータ）→ HTML生成 → プレビュー / 書き出し
   ================================================================ */

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const STORE_KEY = 'hp-builder-v1';

let state = null;      // { template, meta, theme, blocks:[{id,type,props}] }
let selected = null;   // 編集中のブロックID
let selectedEl = null; // 編集中の要素 {role, kind, name}
let uidSeq = 0;
const DEFAULT_MOTION = { anim: 'fadeup', dur: 900, stagger: 40, ease: 'cubic-bezier(.2,.7,.3,1)', reveal: true };
const uid = () => `b${Date.now().toString(36)}${(uidSeq++).toString(36)}`;
const closed = new Set(); // 折りたたんでいる繰り返し項目

/* ---------------- データの組み立て ---------------- */
const clone = (o) => JSON.parse(JSON.stringify(o));

function makeBlock(type, override = {}) {
  return { id: uid(), type, props: Object.assign(clone(BLOCKS[type].defaults), clone(override)) };
}

function buildState(tplKey) {
  const t = TEMPLATES[tplKey];
  return {
    template: tplKey,
    meta: {
      title: t.blocks[0]?.props?.logo || 'My Website',
      description: 'このサイトの説明を入れてください。検索結果やSNSでの共有時に表示されます。',
      lang: 'ja',
    },
    theme: clone(t.theme),
    motion: clone(DEFAULT_MOTION),
    blocks: t.blocks.map((b) => makeBlock(b.type, b.props)),
  };
}

/* 動きの初期設定 */
const MOTION_EASES = [
  ['cubic-bezier(.2,.7,.3,1)', 'なめらか（標準）'],
  ['cubic-bezier(.16,1,.3,1)', 'ぬるっと減速'],
  ['cubic-bezier(.34,1.56,.64,1)', '行き過ぎて戻る'],
  ['cubic-bezier(.76,0,.24,1)', 'ためて一気に'],
  ['linear', '等速'],
];

/* ---------------- 保存 / 読み込み ---------------- */
let saveTimer;
function save() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify(state));
      flash('保存しました');
    } catch (e) {
      flash('保存できません（画像が大きすぎるかも）');
    }
  }, 400);
}
function flash(msg) {
  const el = $('#saved');
  el.textContent = msg;
  clearTimeout(flash._t);
  flash._t = setTimeout(() => { el.textContent = ''; }, 1800);
}
function load() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return null;
    const s = JSON.parse(raw);
    // 知らないブロックが混ざっていたら捨てる（定義を消した時の保険）
    s.blocks = (s.blocks || []).filter((b) => BLOCKS[b.type]);
    s.motion = Object.assign(clone(DEFAULT_MOTION), s.motion || {}); // 旧データ対策
    return s.blocks.length ? s : null;
  } catch (e) { return null; }
}

/* ================================================================
   HTML生成
   ================================================================ */
function themeCSS(t) {
  return `:root{
  --c-primary:${t.primary};
  --c-accent:${t.accent};
  --c-bg:${t.bg};
  --c-surface:${t.surface};
  --c-text:${t.text};
  --c-muted:${t.muted};
  --c-border:${t.border};
  --c-dark:${t.dark};
  --radius:${t.radius}px;
  --max:${t.max}px;
  --font:${fontStack(t.font)};
  --font-head:${fontStack(t.fontHead)};
  --ta-dur:${(state.motion.dur / 1000)}s;
  --ta-stagger:${(state.motion.stagger / 1000)}s;
  --ta-ease:${state.motion.ease};
}`;
}

const bodyHTML = () => state.blocks.map((b) => BLOCKS[b.type].render(b.props)).join('\n\n');

/* 書き出し時は編集画面専用の属性を取り除く（動作に必要な data-ta/-ia/-anim/-delay は残す） */
const exportBody = () => bodyHTML().replace(/ data-el(?:name|kind)?="[^"]*"/g, '');

/* 書き出し用の完成HTML（1ファイルで動く） */
function fullHTML() {
  const m = state.meta;
  return `<!DOCTYPE html>
<html lang="${esc(m.lang || 'ja')}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>${esc(m.title)}</title>
<meta name="description" content="${esc(m.description)}">
<meta property="og:title" content="${esc(m.title)}">
<meta property="og:description" content="${esc(m.description)}">
<meta property="og:type" content="website">
<style>
${themeCSS(state.theme)}
${SITE_CSS}
</style>
</head>
<body class="tpl-${esc(state.template)}" data-anim="${esc(state.motion.anim)}" data-reveal="${state.motion.reveal ? 1 : 0}">

${exportBody()}

<script>${SITE_JS}<\/script>
</body>
</html>`;
}

/* ================================================================
   プレビュー
   ================================================================ */
const PREVIEW_CSS = `
[data-bid]{position:relative;transition:outline-color .15s}
[data-bid]{outline:2px solid transparent;outline-offset:-2px}
[data-bid]:hover{outline-color:rgba(76,141,255,.45);cursor:pointer}
[data-bid].__sel{outline-color:#4c8dff}

/* クリックできる要素 */
[data-el]{position:relative;outline:1px dashed transparent;outline-offset:3px;
  transition:outline-color .12s}
[data-el]:hover{outline-color:rgba(76,141,255,.85);cursor:pointer}
[data-el].__elsel{outline:2px solid #4c8dff;outline-style:solid}
[data-el]:hover::after,[data-el].__elsel::after{
  content:attr(data-elname);position:absolute;top:2px;left:2px;z-index:20;
  background:#4c8dff;color:#fff;border-radius:4px;padding:1px 7px;pointer-events:none;
  font:700 10px/1.7 -apple-system,"Hiragino Sans",sans-serif;letter-spacing:.04em;white-space:nowrap}
[data-elkind="ia"]:hover::after,[data-elkind="ia"].__elsel::after{background:#8b5cf6}
[data-elkind="ia"]:hover{outline-color:rgba(139,92,246,.85)}
[data-elkind="ia"].__elsel{outline-color:#8b5cf6}
`;

let pdoc = null;
function initPreview() {
  const f = $('#preview');
  return new Promise((res) => {
    f.addEventListener('load', () => {
      pdoc = f.contentDocument;
      pdoc.getElementById('s-base').textContent = SITE_CSS;
      pdoc.getElementById('s-edit').textContent = PREVIEW_CSS;
      pdoc.addEventListener('click', (e) => {
        e.preventDefault();
        const blk = e.target.closest('[data-bid]');
        if (!blk) return;
        const elt = e.target.closest('[data-el]');
        if (elt) selectEl(blk.dataset.bid, elt.dataset.el, elt.dataset.elkind, elt.dataset.elname);
        else { selectedEl = null; select(blk.dataset.bid); }
      });
      res();
    }, { once: true });
    f.srcdoc = `<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style id="s-base"></style><style id="s-theme"></style><style id="s-edit"></style>
</head><body></body></html>`;
  });
}

let pvTimer;
function renderPreview(now = false) {
  clearTimeout(pvTimer);
  const run = () => {
    if (!pdoc) return;
    pdoc.getElementById('s-theme').textContent = themeCSS(state.theme);
    pdoc.body.className = `tpl-${state.template}`;
    pdoc.body.setAttribute('data-anim', state.motion.anim);
    pdoc.body.setAttribute('data-reveal', state.motion.reveal ? '1' : '0');
    pdoc.body.innerHTML = bodyHTML();
    // 生成されたトップレベル要素とブロックを対応づける（クリックで選択できるように）
    [...pdoc.body.children].forEach((el, i) => {
      const b = state.blocks[i];
      if (!b) return;
      el.dataset.bid = b.id;
      if (b.id === selected) el.classList.add('__sel');
    });
    const s = pdoc.createElement('script');
    s.textContent = SITE_JS;
    pdoc.body.appendChild(s);
    markSelectedEl();
  };
  now ? run() : (pvTimer = setTimeout(run, 160));
}

function highlight() {
  if (!pdoc) return;
  $$('[data-bid]', pdoc).forEach((el) => el.classList.toggle('__sel', el.dataset.bid === selected));
  markSelectedEl();
}

/* 選択中の要素に枠を戻す（プレビューを作り直すと消えるため） */
function markSelectedEl() {
  if (!pdoc) return;
  $$('[data-el].__elsel', pdoc).forEach((el) => el.classList.remove('__elsel'));
  if (!selectedEl || !selected) return;
  const blk = pdoc.querySelector(`[data-bid="${selected}"]`);
  const el = blk && blk.querySelector(`[data-el="${selectedEl.role}"]`);
  if (el) el.classList.add('__elsel');
}

function selectEl(blockId, role, kind, name) {
  selected = blockId;
  selectedEl = { role, kind, name };
  renderList(); renderEditor(); highlight();
}
function scrollToBlock(id) {
  const el = pdoc && pdoc.querySelector(`[data-bid="${id}"]`);
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

/* ================================================================
   左パネル：ブロック一覧
   ================================================================ */
function renderList() {
  const wrap = $('#blockList');
  wrap.innerHTML = state.blocks.map((b, i) => {
    const def = BLOCKS[b.type];
    const label = b.props.title || b.props.logo || def.label;
    const fixed = def.unique;   // ヘッダー・フッターは位置が決まっているので動かさない
    return `<div class="bl-item${b.id === selected ? ' on' : ''}" data-id="${b.id}"
        draggable="${fixed ? 'false' : 'true'}">
      <span class="bl-grip">${fixed ? '&nbsp;' : '⠿'}</span>
      <span class="bl-ic">${def.icon}</span>
      <span class="bl-name">${esc(label)}<br><span class="bl-sub">${def.label}</span></span>
      <span class="bl-ops">
        <button data-act="up" title="上へ"${i === 0 ? ' disabled' : ''}>↑</button>
        <button data-act="down" title="下へ"${i === state.blocks.length - 1 ? ' disabled' : ''}>↓</button>
        <button data-act="dup" title="複製">⧉</button>
        <button data-act="del" title="削除">✕</button>
      </span>
    </div>`;
  }).join('');
}

$('#blockList').addEventListener('click', (e) => {
  const item = e.target.closest('.bl-item');
  if (!item) return;
  const id = item.dataset.id;
  const i = state.blocks.findIndex((b) => b.id === id);
  const act = e.target.closest('button')?.dataset.act;

  if (!act) { selectedEl = null; select(id); scrollToBlock(id); return; }
  if (act === 'up' && i > 0) state.blocks.splice(i - 1, 0, state.blocks.splice(i, 1)[0]);
  if (act === 'down' && i < state.blocks.length - 1) state.blocks.splice(i + 1, 0, state.blocks.splice(i, 1)[0]);
  if (act === 'dup') {
    const c = clone(state.blocks[i]); c.id = uid();
    state.blocks.splice(i + 1, 0, c); selected = c.id;
  }
  if (act === 'del') {
    if (!confirm(`「${BLOCKS[state.blocks[i].type].label}」を削除しますか？`)) return;
    state.blocks.splice(i, 1);
    if (selected === id) selected = state.blocks[Math.min(i, state.blocks.length - 1)]?.id || null;
  }
  refresh();
});

/* ================================================================
   ドラッグ&ドロップ（並べ替え / 位置を指定して追加）
   ================================================================ */
const listEl = $('#blockList');
let drag = null;   // {mode:'move', id} または {mode:'add', type}

/* ヘッダーは先頭、フッターは末尾に固定されるので、その内側に収める */
function clampIdx(i) {
  const lo = state.blocks[0] && state.blocks[0].type === 'header' ? 1 : 0;
  const fi = state.blocks.findIndex((b) => b.type === 'footer');
  const hi = fi >= 0 ? fi : state.blocks.length;
  return Math.min(Math.max(i, lo), hi);
}

/* マウス位置から挿入先を求める（各項目の上半分なら手前） */
function dropIndex(y) {
  const items = $$('.bl-item', listEl);
  for (let i = 0; i < items.length; i++) {
    const r = items[i].getBoundingClientRect();
    if (y < r.top + r.height / 2) return i;
  }
  return items.length;
}

function showLine(idx) {
  const items = $$('.bl-item', listEl);
  items.forEach((it) => it.classList.remove('over-top', 'over-bottom'));
  if (!items.length) return;
  if (idx < items.length) items[idx].classList.add('over-top');
  else items[items.length - 1].classList.add('over-bottom');
}
function clearDrag() {
  drag = null;
  listEl.classList.remove('dropping');
  $$('.bl-item', listEl).forEach((it) => it.classList.remove('over-top', 'over-bottom', 'dragging'));
}

listEl.addEventListener('dragstart', (e) => {
  const it = e.target.closest('.bl-item');
  if (!it || it.getAttribute('draggable') === 'false') return;
  drag = { mode: 'move', id: it.dataset.id };
  it.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', it.dataset.id);
});
listEl.addEventListener('dragend', clearDrag);

listEl.addEventListener('dragover', (e) => {
  if (!drag) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = drag.mode === 'add' ? 'copy' : 'move';
  listEl.classList.add('dropping');
  showLine(clampIdx(dropIndex(e.clientY)));
});
listEl.addEventListener('dragleave', (e) => {
  if (!listEl.contains(e.relatedTarget)) {
    $$('.bl-item', listEl).forEach((it) => it.classList.remove('over-top', 'over-bottom'));
    listEl.classList.remove('dropping');
  }
});

listEl.addEventListener('drop', (e) => {
  if (!drag) return;
  e.preventDefault();
  let at = clampIdx(dropIndex(e.clientY));

  if (drag.mode === 'move') {
    const from = state.blocks.findIndex((b) => b.id === drag.id);
    if (from < 0) return clearDrag();
    if (at > from) at--;                       // 自分を抜いた分だけ詰まる
    if (at !== from) {
      state.blocks.splice(at, 0, state.blocks.splice(from, 1)[0]);
    }
    selected = drag.id;
  } else {
    const nb = makeBlock(drag.type);
    state.blocks.splice(at, 0, nb);
    selected = nb.id;
    selectedEl = null;
    $('#addMenu').hidden = true;
  }
  clearDrag();
  refresh();
  const id = selected;
  setTimeout(() => scrollToBlock(id), 220);
});

/* ================================================================
   右パネル：編集フォーム（fields から自動生成）
   ================================================================ */
function inputHTML(f, val, path) {
  const p = `data-path="${path}"`;
  switch (f.type) {
    case 'textarea':
      return `<textarea ${p} rows="${f.rows || 4}">${esc(val ?? '')}</textarea>`;
    case 'select':
      return `<select ${p}>${f.options.map(([v, l]) =>
        `<option value="${esc(v)}"${String(val ?? '') === String(v) ? ' selected' : ''}>${esc(l)}</option>`).join('')}</select>`;
    case 'toggle':
      return `<label class="sw"><input type="checkbox" ${p}${val ? ' checked' : ''}>${esc(f.label)}</label>`;
    case 'color':
      return `<div class="f-row"><input type="color" ${p} value="${esc(val)}">
        <input type="text" data-path="${path}" value="${esc(val)}"></div>`;
    case 'range':
      return `<div class="f-row"><input type="range" ${p} min="${f.min ?? 0}" max="${f.max ?? 100}" value="${val ?? 0}" data-suffix="${esc(f.suffix || '')}">
        <span class="f-val">${val ?? 0}${f.suffix || ''}</span></div>`;
    case 'image':
      return `<div class="img-f">
        <input type="text" ${p} value="${esc(val ?? '')}" placeholder="https://... または端末から選択">
        <button class="pick" data-pick="${path}">画像を選ぶ</button>
      </div>${val ? `<img class="img-thumb" src="${esc(val)}" alt="">` : ''}`;
    default:
      return `<input type="text" ${p} value="${esc(val ?? '')}">`;
  }
}

function fieldHTML(f, props, base) {
  if (f.showIf && !f.showIf(props)) return '';
  const path = `${base}.${f.key}`;
  const val = props[f.key];

  if (f.type === 'list') {
    const items = val || [];
    const rows = items.map((it, i) => {
      const key = `${path}.${i}`;
      const isClosed = closed.has(key);
      const title = it[f.titleKey] || `項目 ${i + 1}`;
      return `<div class="li${isClosed ? ' closed' : ''}" data-i="${i}">
        <div class="li-h" data-fold="${key}">
          <span class="n">${i + 1}</span>
          <span class="t">${esc(title)}</span>
          <button data-lact="up" data-i="${i}" title="上へ">↑</button>
          <button data-lact="down" data-i="${i}" title="下へ">↓</button>
          <button data-lact="del" data-i="${i}" title="削除">✕</button>
        </div>
        <div class="li-b"${isClosed ? ' hidden' : ''}>
          ${f.item.map((sf) => fieldHTML(sf, it, key)).join('')}
        </div>
      </div>`;
    }).join('');
    return `<div class="f">
      <label>${esc(f.label)}</label>
      <div class="list" data-list="${path}">
        ${rows}
        <button class="li-add" data-lact="add">＋ ${esc(f.addLabel || '追加')}</button>
      </div>
    </div>`;
  }

  if (f.type === 'toggle') {
    return `<div class="f">${inputHTML(f, val, path)}${f.hint ? `<div class="hint">${esc(f.hint)}</div>` : ''}</div>`;
  }
  return `<div class="f">
    <label>${esc(f.label)}</label>
    ${inputHTML(f, val, path)}
    ${f.hint ? `<div class="hint">${esc(f.hint)}</div>` : ''}
  </div>`;
}

function renderEditor() {
  const box = $('#tab-edit');
  const b = state.blocks.find((x) => x.id === selected);
  if (!b) {
    box.innerHTML = `<div class="empty">左の一覧、またはプレビューを<br>クリックしてブロックを選んでください。</div>`;
    return;
  }
  const def = BLOCKS[b.type];
  const keep = box.scrollTop;
  box.innerHTML = `<div class="edit-head"><span class="bl-ic">${def.icon}</span>${esc(def.label)}</div>`
    + elementPanel(b)

}

/* 選択中の要素にアニメーションを付けるパネル */
function elementPanel(b) {
  if (!selectedEl) {
    return `<div class="el-hint">
      プレビューの<b>文字や画像をクリック</b>すると、そこにアニメーションを付けられます。<br>
      テキストは文字アニメ12種、画像・カードは動き12種から選べます。

  }
  const isText = selectedEl.kind === 'ta';

  return `<div class="el-panel">

        `<option value="${v}"${cur === v ? ' selected' : ''}>${esc(l)}</option>`).join('')}</select>
    </div>
    <div class="f"><label>開始までの待ち</label>
      <div class="f-row">
        <input type="range" data-elk="d" min="0" max="1500" step="50" value="${delay}" data-suffix="ms">

/* ---- 値の書き込み ---- */
function setPath(root, path, val) {
  const ks = path.split('.');
  let o = root;
  for (let i = 0; i < ks.length - 1; i++) o = o[ks[i]];
  o[ks[ks.length - 1]] = val;
}
function readEl(el) {
  if (el.type === 'checkbox') return el.checked;
  if (el.type === 'range' || el.type === 'number') return Number(el.value);
  return el.value;
}

$('#tab-edit').addEventListener('input', (e) => {

  if (!el.dataset.path) return;   // 要素パネル（data-elk）は別のハンドラが処理する
  const b = state.blocks.find((x) => x.id === selected);
  if (!b) return;
  setPath(b, el.dataset.path, readEl(el));
  if (el.type === 'range') el.parentElement.querySelector('.f-val').textContent = el.value + (el.dataset.suffix || '');
  renderList();
  renderPreview();
  save();
});

/* ---- 繰り返し項目の操作 ---- */
$('#tab-edit').addEventListener('click', (e) => {
  const b = state.blocks.find((x) => x.id === selected);
  if (!b) return;

  const fold = e.target.closest('.li-h');
  if (fold && !e.target.closest('button')) {
    const k = fold.dataset.fold;
    closed.has(k) ? closed.delete(k) : closed.add(k);
    renderEditor();
    return;
  }

  const btn = e.target.closest('[data-lact]');
  if (!btn) return;
  const listEl = btn.closest('.list');
  const path = listEl.dataset.list;
  const arr = path.split('.').slice(1).reduce((o, k) => o[k], b.props);
  const i = Number(btn.dataset.i);
  const act = btn.dataset.lact;

  if (act === 'add') {
    // 直前の項目と同じ形の空データを作る
    const fdef = findListField(b.type, path);
    const blank = {};
    (fdef?.item || []).forEach((sf) => { blank[sf.key] = sf.type === 'toggle' ? false : ''; });
    arr.push(blank);
    closed.delete(`${path}.${arr.length - 1}`);
  }
  if (act === 'del') arr.splice(i, 1);
  if (act === 'up' && i > 0) arr.splice(i - 1, 0, arr.splice(i, 1)[0]);
  if (act === 'down' && i < arr.length - 1) arr.splice(i + 1, 0, arr.splice(i, 1)[0]);

  renderEditor(); renderList(); renderPreview(); save();
});

function findListField(type, path) {
  const key = path.split('.').pop();
  const walk = (fields) => {
    for (const f of fields) {
      if (f.key === key && f.type === 'list') return f;
      if (f.type === 'list') { const r = walk(f.item); if (r) return r; }
    }
    return null;
  };
  return walk(BLOCKS[type].fields);
}

$('#btnCode').addEventListener('click', () => { $('#codeArea').value = fullHTML(); openModal('#codeModal'); });
$('#codeClose').addEventListener('click', () => closeModal('#codeModal'));
$('#codeCopy').addEventListener('click', async () => {
  const ta = $('#codeArea');
  try { await navigator.clipboard.writeText(ta.value); } catch (e) { ta.select(); document.execCommand('copy'); }
  flash('コピーしました');
});
$('#btnReset').addEventListener('click', () => {
  if (!confirm('編集した内容をすべて消して、テンプレート選択に戻ります。よろしいですか？')) return;
  localStorage.removeItem(STORE_KEY);
  location.reload();
});
$('#devices').addEventListener('click', (e) => {
  const b = e.target.closest('button');
  if (!b) return;
  $$('#devices button').forEach((x) => x.classList.toggle('on', x === b));
  $('#frame').style.width = b.dataset.w;
});
$$('.modal').forEach((m) => m.addEventListener('click', (e) => { if (e.target === m) m.hidden = true; }));
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') $$('.modal').forEach((m) => (m.hidden = true)); });

/* ================================================================
   まとめて再描画
   ================================================================ */
function select(id) { selected = id; renderList(); renderEditor(); highlight(); }
function refresh() { renderList(); renderEditor(); renderDesign(); renderPage(); renderPreview(true); save(); }

/* ---------------- 起動 ---------------- */
(async function start() {
  await initPreview();
  const saved = load();
  if (saved) {
    state = saved;
    selected = state.blocks[1]?.id || state.blocks[0]?.id;
    refresh();
  } else {
    renderTplGrid();
    openModal('#tplModal');
    state = buildState('corporate');
    selected = state.blocks[1].id;
    refresh();
  }
})();

</script>
