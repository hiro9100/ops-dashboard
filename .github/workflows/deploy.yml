# Firebase へ出す
#
# パソコンが無くても出せるようにするための仕掛け。
# GitHub の画面から「Run workflow」を押すだけで、ここが代わりに
# firebase deploy まで走らせる。スマホのブラウザからも押せる。
#
# 動かすには、リポジトリに FIREBASE_SERVICE_ACCOUNT という秘密の値が要る。
# 入れ方は hp-builder/firebase/README.md に書いてある。

name: Firebase へ出す

on:
  workflow_dispatch:          # 画面のボタンから手で走らせる
  push:
    branches: [claude/hp-creator-template-tool-ohuuqb]
    paths:
      - 'hp-builder/**'
      - 'docs/**'
      - '.github/workflows/deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 公開用の docs/ を作り直してから出す。
      # 中身が古いまま出てしまうのを防ぐ。
      - name: 公開用の一式を組み立てる
        working-directory: hp-builder
        run: node build-site.js

      - name: 文字づかいを確かめる
        working-directory: hp-builder
        run: node check-text.js

      # 秘密の値はシェルに直接展開せず、環境変数を経由して書き出す
      # （中身に何が入っていても壊れないように）
      - name: 認証情報を置く
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT が設定されていません。" >&2
            echo "hp-builder/firebase/README.md の手順で入れてください。" >&2
            exit 1
          fi
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          # 貼り付けが途中で切れていると、この先で分かりにくい形で落ちる。
          # ここで形だけ確かめて、何が起きたか言えるようにしておく。
          node -e '
            const fs = require("fs");
            const s = fs.readFileSync(process.env.RUNNER_TEMP + "/sa.json", "utf8");
            let j;
            try { j = JSON.parse(s); }
            catch (e) {
              // 鍵そのものは出さない。何が起きたか分かるだけの手がかりを出す。
              const t = s.trim();
              console.error("秘密の値がJSONとして読めません。");
              console.error(`  長さ            ${s.length} 文字`);
              console.error(`  先頭が { か     ${t.startsWith("{") ? "はい" : "いいえ（ここが原因の可能性が高い）"}`);
              console.error(`  末尾が } か     ${t.endsWith("}") ? "はい" : "いいえ（途中で切れています）"}`);
              console.error(`  全角の引用符    ${/[“”„]/.test(s) ? "あり（スマホが引用符を変換しています）" : "なし"}`);
              console.error(`  private_key の語 ${s.includes("private_key") ? "あり" : "なし（別のファイルかもしれません）"}`);
              console.error(`  読めなかった理由 ${e.message}`);
              process.exit(1);
            }
            for (const k of ["type", "project_id", "private_key", "client_email"]) {
              if (!j[k]) { console.error(`JSONに ${k} がありません。別のファイルを貼っていないか確かめてください。`); process.exit(1); }
            }
            if (j.project_id !== "bildy-4e45e") {
              console.error(`別のプロジェクトの鍵です: ${j.project_id}`);
              process.exit(1);
            }
            console.log(`鍵を確認しました: ${j.client_email}`);
          '

      - name: Firebase へ出す
        working-directory: hp-builder/firebase
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: |
          npm --prefix functions ci --no-audit --no-fund || npm --prefix functions install
          # 出すものを名指しする。指定しないと Extensions まで確認しに行き、
          # 使っていないのに、その API の反映待ちで 403 になって止まる（実際に起きた）。
          npx --yes firebase-tools@14 deploy --project bildy-4e45e --non-interactive \
            --only hosting,functions,storage,firestore

      - name: 出したもの
        run: |
          echo "https://bildy-4e45e.web.app/        サービスLP"
          echo "https://bildy-4e45e.web.app/app/    編集ツール"
          echo "https://bildy-4e45e.web.app/s/<ID>  公開されたページ"
