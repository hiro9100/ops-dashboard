# Firebase へ出す
#
# パソコンが無くても出せるようにするための仕掛け。
# GitHub の画面から「Run workflow」を押すだけで、ここが代わりに
# firebase deploy まで走らせる。スマホのブラウザからも押せる。
#
# 動かすには、リポジトリに FIREBASE_SERVICE_ACCOUNT という秘密の値が要る。
# 入れ方は hp-builder/firebase/README.md に書いてある。

name: Firebase へ出す

on:
  workflow_dispatch:          # 画面のボタンから手で走らせる
  push:
    branches: [claude/hp-creator-template-tool-ohuuqb]
    paths:
      - 'hp-builder/**'
      - 'docs/**'
      - '.github/workflows/deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 公開用の docs/ を作り直してから出す。
      # 中身が古いまま出てしまうのを防ぐ。
      - name: 公開用の一式を組み立てる
        working-directory: hp-builder
        run: node build-site.js

      - name: 文字づかいを確かめる
        working-directory: hp-builder
        run: node check-text.js

      # 秘密の値はシェルに直接展開せず、環境変数を経由して書き出す
      # （中身に何が入っていても壊れないように）
      - name: 認証情報を置く
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT が設定されていません。" >&2
            echo "hp-builder/firebase/README.md の手順で入れてください。" >&2
            exit 1
          fi
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          # 貼り付けが途中で切れていると、この先で分かりにくい形で落ちる。
          # ここで形だけ確かめて、何が起きたか言えるようにしておく。
          node -e '
            const fs = require("fs");
            const s = fs.readFileSync(process.env.RUNNER_TEMP + "/sa.json", "utf8");
            let j;
            try { j = JSON.parse(s); }
            catch (e) {
              // 鍵そのものは出さない。何が起きたか分かるだけの手がかりを出す。
              const t = s.trim();
              console.error("秘密の値がJSONとして読めません。");
              console.error(`  長さ            ${s.length} 文字`);
              console.error(`  先頭が { か     ${t.startsWith("{") ? "はい" : "いいえ（ここが原因の可能性が高い）"}`);
              console.error(`  末尾が } か     ${t.endsWith("}") ? "はい" : "いいえ（途中で切れています）"}`);
              console.error(`  全角の引用符    ${/[“”„]/.test(s) ? "あり（スマホが引用符を変換しています）" : "なし"}`);
              console.error(`  private_key の語 ${s.includes("private_key") ? "あり" : "なし（別のファイルかもしれません）"}`);
              console.error(`  読めなかった理由 ${e.message}`);
              process.exit(1);
            }
            for (const k of ["type", "project_id", "private_key", "client_email"]) {
              if (!j[k]) { console.error(`JSONに ${k} がありません。別のファイルを貼っていないか確かめてください。`); process.exit(1); }
            }
            if (j.project_id !== "bildy-4e45e") {
              console.error(`別のプロジェクトの鍵です: ${j.project_id}`);
              process.exit(1);
            }
            console.log(`鍵を確認しました: ${j.client_email}`);
          '

      # 公開されたページは、編集ツールとは別のドメインに置く。
      # 同じところに居ると、公開ページで何かが動いた瞬間に、同じドメインの
      # 編集画面の控え（合言葉）に手が届く。理由は hp-builder/firebase/README.md。
      #
      # 置き場は一度作れば残るので、ここは2回目からは何もしない。
      # 作れなかったときは、その場で止める。中途半端に出すと
      # 「公開はできるのにアドレスの先が無い」になる。
      - name: 公開ページ用の置き場を用意する
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: |
          SITE=bildy-4e45e-pages
          if npx --yes firebase-tools@14 hosting:sites:list --project bildy-4e45e --json \
               | grep -q "\"$SITE\""; then
            echo "  ok   $SITE はすでにあります"
            exit 0
          fi
          echo "  $SITE を作ります（初回だけ）"
          if npx --yes firebase-tools@14 hosting:sites:create "$SITE" \
               --project bildy-4e45e --non-interactive; then
            echo "  ok   作りました"
          else
            echo "" >&2
            echo "$SITE を作れませんでした。" >&2
            echo "名前がすでに世界のどこかで使われているか、鍵に Firebase Admin の" >&2
            echo "権限が足りません（hp-builder/firebase/README.md の権限の表）。" >&2
            echo "" >&2
            echo "急ぐときは、firebase.json の置き場の指定を1つに戻し、" >&2
            echo "そこの行き先の一覧に次の1行を戻せば、これまでどおりの形で出せます。" >&2
            echo "  { \"source\": \"/s/**\", \"function\": { \"functionId\": \"serveSite\"," >&2
            echo "    \"region\": \"asia-northeast1\" } }" >&2
            exit 1
          fi

      # firebase.json はリポジトリ直下に置いてある。
      # Hosting は firebase.json より上のフォルダを配信できず、配信するのは
      # 直下の docs/ なので、設定もここに無いと「outside of project directory」で
      # 止まる（実際に起きた）。ルールと Function の実体は hp-builder/firebase/。
      - name: Firebase へ出す
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: |
          FN=hp-builder/firebase/functions
          npm --prefix "$FN" ci --no-audit --no-fund || npm --prefix "$FN" install
          # 出すものを名指しする。指定しないと Extensions まで確認しに行き、
          # 使っていないのに、その API の反映待ちで 403 になって止まる（実際に起きた）。
          # --force は、Function を組み立てたときに残る古いイメージを
          # 自動で捨てる設定を、確認を求めずに入れるため。無いと
          # 「決められないので設定できなかった」で落ちる（実際に起きた）。
          # 放っておくとイメージが貯まって毎月わずかに課金される。
          npx --yes firebase-tools@14 deploy --project bildy-4e45e --non-interactive --force \
            --only hosting,functions,storage,firestore

      # 1日の上限を数える札（quota/）は、置いておいても読まない。
      # 1日1万人だと1年で数百万件たまり、置き場代だけがかかる。
      # 札には捨てどき（expireAt）を入れてあるので、それを見て消して
      # もらう設定を、ここで入れる。すでに入っていれば何も起きない。
      #
      # ここは失敗しても止めない。入っていなくても動きはするし、
      # 権限の話でサイトまで出せなくなるほうが困る。
      - name: 数えた札の捨てどきを設定する
        continue-on-error: true
        run: |
          gcloud auth activate-service-account --key-file="$RUNNER_TEMP/sa.json" --quiet
          if gcloud firestore fields ttls update expireAt \
               --collection-group=quota --enable-ttl \
               --project=bildy-4e45e --quiet --async; then
            echo "  ok   quota/expireAt の捨てどきを設定しました"
          else
            echo "  ※ 設定できませんでした。動きには影響しませんが、"
            echo "     札がたまり続けます。手順は hp-builder/firebase/README.md の"
            echo "     「数えた札を、置きっぱなしにしない」"
          fi

      # deploy が「成功」で終わっても、一部の Function が作られていないこと
      # がある（2つの Function が同じ置き場バケツを同時に作ろうとして 409 に
      # なり、publishSite だけ落ちたのに全体は成功扱いだった）。
      # 出したものを実際に叩いて、動いていることを確かめる。
      - name: 動いているか確かめる
        run: |
          ng=0
          check () {   # check <URL> <期待するコード> <説明>
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$1" || echo 000)
            if [ "$code" = "$2" ]; then
              echo "  ok   $3  ($1 → $code)"
            else
              echo "  NG   $3  ($1 → $code、$2 のはず)"; ng=$((ng+1))
            fi
          }
          B=https://bildy-4e45e.web.app
          check "$B/"                 200 "サービスLP"
          check "$B/app/"             200 "編集ツール"
          # 編集ツールは中身を分けて置いてある。骨組みだけ出て中身が
          # 出ていないと、真っ白な画面になる。名前は指紋つきで毎回
          # 変わるので、骨組みから読み取って、そのまま叩く。
          for f in $(curl -s --max-time 30 "$B/app/" | grep -o 'a/[a-z-]*\.[0-9a-f]\{8\}\.\(js\|css\)' | sort -u); do
            check "$B/app/$f"         200 "編集ツールの中身（$f）"
          done
          check "$B/demo/"            200 "見本の一覧"
          # 受け口は POST 専用。GET で 405 が返れば、Function が生きている
          check "$B/api/publish"      405 "公開の受け口（publishSite）"
          # 業種の見本写真。ここが404だと、顔をえらぶ画面が描いた絵のままになる
          # （出ていないことに気づけないので、名指しで確かめる）
          check "$B/art/cafe-1.jpg"   200 "業種の見本写真（art/）"

          # 公開されたページは、別のドメインから配る。
          P=https://bildy-4e45e-pages.web.app
          # 中身の無いサイトIDは、配信の Function が 404 の画面を返す
          check "$P/s/nothing-here"   404 "公開ページの配信（serveSite）"
          check "$P/"                 200 "公開ページ側の入口"

          # ここがいちばん大事。編集ツールと同じドメインからは、もう配らない。
          # 配ってしまうと、他人のHTMLが編集画面と同じ持ち主として動く。
          same=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$B/s/nothing-here" || echo 000)
          if [ "$same" = "404" ]; then
            echo "  ok   編集ツールと同じドメインからは配っていない ($B/s/… → 404)"
          else
            echo "  NG   $B/s/… がまだ生きています（→ $same）。分けた意味が無くなります"
            ng=$((ng+1))
          fi

          if [ "$ng" -gt 0 ]; then
            echo "出したはずのものが $ng 件、応答していません。" >&2
            exit 1
          fi
          echo ""
          echo "$B/        サービスLP"
          echo "$B/app/    編集ツール"
          echo "$P/s/<ID>  公開されたページ"
